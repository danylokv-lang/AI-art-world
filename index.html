<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AETHER — a living world from a phrase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/ui/styles.css" />
  </head>
  <body>
    <!-- Two cross-fading backdrop layers (the AI painting) -->
    <div class="stage">
      <div class="layer" id="layerA"></div>
      <div class="layer" id="layerB"></div>
      <canvas class="fx" id="fx"></canvas>
    </div>
    <div class="atmosphere" aria-hidden="true"></div>

    <!-- HUD -->
    <header class="hud" id="hud">
      <div class="hud__name" id="worldName">the void</div>
      <div class="hud__sub" id="worldTagline">nothing has been spoken yet</div>
      <div class="hud__meta">
        <span class="live" id="live"><i></i> living</span>
        <span id="metaPhase">—</span>
        <span id="metaBeat">age 0</span>
      </div>
      <div class="beat" id="beat"></div>
    </header>

    <!-- Onboarding -->
    <section class="onboarding" id="onboarding">
      <h1 class="onboarding__title">Speak a world into being.</h1>
      <p class="onboarding__hint">A place will be painted — then it lives on its own: time passes, weather turns, and it answers whatever you say next.</p>
      <div class="chips" id="chips"></div>
    </section>

    <!-- Timeline / memory filmstrip -->
    <div class="film" id="film" aria-hidden="true"></div>

    <!-- Command bar -->
    <div class="commandbar" id="commandbar">
      <button class="mic" id="mic" title="Speak" aria-label="Speak">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <input id="phrase" class="phrase" type="text" autocomplete="off" spellcheck="false" placeholder="describe a place, or tell the world what happens next…" />
      <button class="send" id="send" title="Breathe life" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="m3 11 18-8-8 18-2-7-8-3Z"/></svg>
      </button>
    </div>

    <div class="status" id="status" aria-live="polite"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
